<!doctype html>
<html lang="ja" data-theme="mint"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>お迎えルールナビ 管理ページ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
h1,h2,h3{margin:0}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--ink);color:var(--on-ink);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side h1{font-size:19px}.side .sub{font-size:12px;font-weight:800;color:var(--soft);margin-bottom:18px}
.side button.nv{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 16px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--on-ink);font-size:15px;font-weight:800;cursor:pointer;text-align:left}
.side button.nv[aria-current="page"]{background:var(--accent);color:var(--ink)}
.badge{min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--blossom);color:var(--ink);border:2px solid var(--ink);font-size:12px;display:flex;align-items:center;justify-content:center}
.side .bt{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side .btn{background:transparent;color:var(--soft);border-color:var(--soft);box-shadow:none}
.side .lo{background:none;border:0;color:var(--soft);font-size:13px;font-weight:800;text-decoration:underline;cursor:pointer;padding:8px}
main{padding:28px 28px 60px;min-width:0}
main h2{font-size:28px}.lead{font-size:14px;margin:6px 0 0;line-height:1.7}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{padding:16px;font-size:13px;font-weight:800}.stat b{display:block;font-size:34px;line-height:1.1}
.col{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.card{flex-wrap:wrap}
.ava{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.nm{font-size:16px;font-weight:800}.nm small{font-size:13px;font-weight:500;margin-left:10px}
.bd{font-size:12px;line-height:1.6;margin-top:4px}
.sbtn{min-height:40px;padding:0 16px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tagsel{border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--bg);font-size:12px;font-weight:800;padding:8px 10px;color:var(--ink)}
.empty{text-align:center;line-height:1.8;font-size:14px;padding:28px 0}
.note{font-size:12px;font-weight:800;line-height:1.6;margin-top:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:18px;align-items:start}
.panel{padding:20px;background:var(--surface);position:sticky;top:20px}
.panel h3{font-size:18px}.fl{font-size:13px;margin:14px 0 6px}
.field{box-shadow:none;font-size:15px;padding:11px 14px}select.field{height:48px}
.sel{background:var(--soft)}.sch{cursor:pointer;min-height:56px}
.tag--no{background:var(--blossom)}
.pend{background:var(--sun)}
@media (max-width:820px){
 .wrap{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 12px}
 .side h1{font-size:16px}.side .sub{display:none}
 .side .tit{width:100%}.side button.nv{width:auto;min-height:40px;padding:0 14px;font-size:13px}
 .side .bt{margin:0;flex-direction:row;align-items:center;width:100%}
 main{padding:20px 14px 60px}.two{grid-template-columns:1fr}.panel{position:static}
 .stats{gap:8px}.stat b{font-size:26px}
}
dialog{border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--pop);padding:20px;width:min(440px,92vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(20,52,44,.5)}
</style></head>
<body><div id="app"></div>
<script type="module">
import {auth,db,A,F,esc,toast,watchSession,errMsg,uploadPdf} from './core.js';
const $=s=>document.querySelector(s),app=$('#app');
const TORD={'小学校':0,'中学校':1,'特別支援学校':2};
const byId=(x,y)=>(TORD[x.type]??9)-(TORD[y.type]??9)||x.id.localeCompare(y.id);
const short=n=>n.replace('静岡市立','');
const kind=s=>s.type==='小学校'?'elem':s.type==='中学校'?'mid':'sp';
const kLabel={elem:'小学校',mid:'中学校',sp:'特別支援'};
const dt=(t,time)=>{const d=t?.toDate?.();return d?d.toLocaleDateString('ja-JP')+(time?' '+d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):''):''};
const NAV=[['users','利用者'],['requests','投稿・編集審査'],['schools','学校データ'],['notices','お知らせ']];
let U=null,P=null,tab='users',S={users:[],schools:[],notices:[],requests:[]},sq='',selId=null;

const hs=decodeURIComponent(location.hash.slice(1));if(NAV.some(n=>n[0]===hs))tab=hs;

const gate=(t,b)=>{app.innerHTML=`<main style="max-width:560px;margin:0 auto"><h2>${t}</h2><div class="card pop" style="display:block;padding:18px;margin-top:16px;line-height:1.8;font-size:14px">${b}</div><div class="col"><a class="btn btn--primary" href="index.html">アプリのログイン画面へ</a></div></main>`};
watchSession(async(u,p)=>{U=u;P=p;
 if(!u)return gate('ログインしてください','先に <b>index.html</b> で管理者アカウントにログインしてから、このページを開いてください。');
 if(!p||p.status!=='active'||p.role!=='admin')return gate('管理者のみ利用できます','このアカウントには管理者権限がありません。');
 shell();
 try{await loadUsers()}catch(e){toast(errMsg(e))}
 // 管理画面を開いたタイミングで、学校住所の空欄をschools.jsから自動補完
 try{await loadSchools()}catch(e){toast('学校住所の自動反映に失敗しました: '+errMsg(e))}
 await show()});

function shell(){
 app.innerHTML=`<div class="wrap"><aside class="side"><div class="tit"><h1>お迎えルールナビ</h1><div class="sub">管理者メニュー</div></div>
 ${NAV.map(([k,l])=>`<button class="nv" data-tab="${k}" aria-current="${k===tab?'page':'false'}"><span>${l}</span></button>`).join('')}
 <div class="bt"><a class="btn" href="index.html">アプリ画面に戻る</a><button class="lo" id="lo">${esc(P.name)} さん／ログアウト</button></div></aside><main id="main"></main></div>`;
 $('#lo').onclick=async()=>{await A.signOut(auth);location.href='index.html'}}
async function show(){
 app.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
 $('#main').innerHTML='<div class="skeleton" style="height:90px"></div>';scrollTo(0,0);
 try{await ({users,requests,schools,notices})[tab]()}catch(e){$('#main').innerHTML=`<p class="empty">読み込めませんでした。<br>${esc(errMsg(e))}</p>`}}
async function loadUsers(){S.users=(await F.getDocs(F.collection(db,'users'))).docs.map(d=>({id:d.id,...d.data()}))}
async function loadSchools(){
 let docs=(await F.getDocs(F.collection(db,'schools'))).docs;
 const source=window.SCHOOLS||[];
 const sourceById=new Map(source.filter(x=>x&&x.id).map(x=>[x.id,x]));
 const targets=docs.filter(d=>{
  const current=d.data(),master=sourceById.get(d.id);
  return master&&String(master.address||'').trim()&&!String(current.address||'').trim();
 });
 // 既存校のうち住所が空欄のものだけ補完。入力済み住所や他の項目は変更しない。
 for(let i=0;i<targets.length;i+=400){
  const batch=F.writeBatch(db);
  targets.slice(i,i+400).forEach(d=>{
   const master=sourceById.get(d.id);
   batch.set(F.doc(db,'schools',d.id),{address:master.address},{merge:true});
  });
  await batch.commit();
 }
 if(targets.length)docs=(await F.getDocs(F.collection(db,'schools'))).docs;
 S.schools=docs.map(d=>({id:d.id,...d.data()})).sort(byId);
}

/* ===== 利用者 ===== */
async function users(){
 await loadUsers();
 const L=S.users.slice().sort((a,b)=>(a.role==='admin'?0:1)-(b.role==='admin'?0:1)||String(a.name).localeCompare(String(b.name)));
 $('#main').innerHTML=`<h2>利用者</h2><p class="lead">登録されている利用者の一覧です(${L.length}人)。</p>
 <div class="col">${L.map(u=>{const me=u.id===U.uid,st=u.status==='active'?'':u.status==='pending'?'承認待ち':u.status==='rejected'?'却下済み':'停止中';
  return `<div class="card pop"><div class="ava">${esc((u.name||'?')[0])}</div><div class="grow"><div class="nm">${esc(u.name)}${me?'(自分)':''}<small>${esc(u.office||'')}</small></div><div class="bd">${esc(u.email||'')}</div><div class="row" style="margin-top:6px"><span class="tag tag--${u.role==='admin'?'sp':'mid'}">${u.role==='admin'?'管理者':'一般'}</span>${st?`<span class="tag tag--no">${st}</span>`:''}</div></div>
  <div class="acts">${me?'':[
   u.status==='active'?`<button class="btn sbtn" data-a="stop" data-id="${u.id}">利用停止</button>`:`<button class="btn btn--primary sbtn" data-a="approve" data-id="${u.id}">${u.status==='pending'?'利用開始':u.status==='rejected'?'利用再開':'再開する'}</button>`,
   u.role==='admin'?`<button class="btn sbtn" data-a="member" data-id="${u.id}">一般に戻す</button>`:`<button class="btn sbtn" data-a="admin" data-id="${u.id}">管理者にする</button>`,
   `<button class="btn btn--danger sbtn" data-a="del" data-id="${u.id}">削除</button>`].join('')}</div></div>`}).join('')||'<p class="empty">まだいません。</p>'}</div>
 <p class="note">「削除」は利用者情報だけを消します。ログイン用のアカウントそのものは、Firebaseコンソールの Authentication から削除してください。</p>`}
async function userAct(a,id,btn){
 const r=F.doc(db,'users',id),u=S.users.find(x=>x.id===id);
 if(a==='del'){if(!confirm(`${u.name} さんを削除しますか?`))return;await F.deleteDoc(r)}
 else if(a==='approve'){const sel=btn.closest('.card').querySelector('[data-role]');await F.updateDoc(r,{status:'active',...(sel?{role:sel.value}:{})})}
 else if(a==='admin'){if(!confirm(`${u.name} さんを管理者にしますか?`))return;await F.updateDoc(r,{role:'admin'})}
 else await F.updateDoc(r,a==='stop'?{status:'disabled'}:{role:'member'});
 toast('更新しました');await show()}


/* ===== 投稿・編集の審査 ===== */
async function requests(){
 const snap=await F.getDocs(F.query(F.collection(db,'requests'),F.orderBy('createdAt','desc')));
 S.requests=snap.docs.map(d=>({id:d.id,...d.data()}));
 const pending=S.requests.filter(r=>r.status==='pending');
 const label={ 'point-create':'送迎ポイントの新規投稿','point-update':'送迎ポイントの編集','point-delete':'送迎ポイントの削除','point-position':'見取図上の位置変更','stamps':'見取図アイコンの変更','school-fields':'学校写真・見取図の変更' };
 $('#main').innerHTML=`<h2>投稿・編集の審査</h2><p class="lead">一般ユーザーから届いた申請を確認し、承認した内容だけ公開データに反映します。</p><div class="col">${pending.map(r=>{const school=S.schools.find(x=>x.id===r.schoolId);return `<div class="card pop" style="display:block;padding:16px"><div class="row"><b class="grow">${esc(label[r.action]||r.action)}</b><span class="tag tag--no">審査待ち</span></div><div class="meta">申請者：${esc(r.userName||'不明')} ・ ${esc(school?.name||r.schoolId||'')}</div><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:10px;border-radius:10px;font-size:12px">${esc(JSON.stringify(r.data||{},null,2))}</pre><div class="acts"><button class="btn btn--primary sbtn" data-req="approve" data-id="${r.id}">承認して反映</button><button class="btn btn--danger sbtn" data-req="reject" data-id="${r.id}">却下</button></div></div>`}).join('')||'<p class="empty">審査待ちの申請はありません。</p>'}</div>`;
}
async function requestAct(action,id,btn){
 const r=S.requests.find(x=>x.id===id);if(!r)return;btn.disabled=true;
 try{
  if(action==='approve'){
   const sr=F.doc(db,'schools',r.schoolId),d=r.data||{};
   if(r.action==='point-create'){const safe={cat:String(d.cat||'').slice(0,40),title:String(d.title||'').slice(0,120),body:String(d.body||'').slice(0,3000),img:typeof d.img==='string'?d.img:'',uid:r.uid,userName:String(r.userName||'利用者').slice(0,80),order:Date.now(),createdAt:F.serverTimestamp()};if(!safe.title)throw new Error('投稿タイトルがありません');const wb=F.writeBatch(db);wb.set(F.doc(F.collection(db,'schools',r.schoolId,'points')),safe);wb.update(sr,{pointCount:F.increment(1)});await wb.commit()}
   else if(r.action==='point-update'){const pr=F.doc(db,'schools',r.schoolId,'points',r.pointId),old=await F.getDoc(pr);if(!old.exists()||old.data().uid!==r.uid)throw new Error('自分の投稿以外は編集申請できません');const safe={};['cat','title','body','img','updatedAt'].forEach(k=>{if(Object.prototype.hasOwnProperty.call(d,k))safe[k]=d[k]});await F.updateDoc(pr,safe)}
   else if(r.action==='point-delete'){const pr=F.doc(db,'schools',r.schoolId,'points',r.pointId),old=await F.getDoc(pr);if(!old.exists()||old.data().uid!==r.uid)throw new Error('自分の投稿以外は削除申請できません');const wb=F.writeBatch(db);wb.delete(pr);wb.update(sr,{pointCount:F.increment(-1)});await wb.commit()}
   else if(r.action==='point-position'){const pr=F.doc(db,'schools',r.schoolId,'points',r.pointId);if(d.remove)await F.updateDoc(pr,{x:F.deleteField(),y:F.deleteField()});else{if(!Number.isFinite(d.x)||!Number.isFinite(d.y)||d.x<0||d.x>100||d.y<0||d.y>100)throw new Error('マッピング位置の申請内容が不正です');await F.updateDoc(pr,{x:d.x,y:d.y})}}
   else if(r.action==='stamps'){if(!Array.isArray(d.stamps)||d.stamps.length>60)throw new Error('見取図アイコンの申請内容が不正です');await F.updateDoc(sr,{stamps:d.stamps})}
   else if(r.action==='school-fields'){const safe={};['photo','plan'].forEach(k=>{if(typeof d[k]==='string'&&d[k].startsWith('https://'))safe[k]=d[k]});if(!Object.keys(safe).length)throw new Error('学校画像の申請内容が不正です');await F.updateDoc(sr,safe)}
  }
  await F.updateDoc(F.doc(db,'requests',id),{status:action==='approve'?'approved':'rejected',reviewedAt:F.serverTimestamp(),reviewedBy:U.uid});
  toast(action==='approve'?'承認して公開データに反映しました':'申請を却下しました');await requests();
 }catch(e){toast(errMsg(e));btn.disabled=false}
}

/* ===== 学校データ ===== */
async function schools(keep){
 if(!keep||!S.schools.length)await loadSchools();
 const have=new Set(S.schools.map(s=>s.id)),miss=(window.SCHOOLS||[]).filter(s=>!have.has(s.id));
 const noAddr=S.schools.filter(s=>!s.address).length;
 const l=S.schools.filter(s=>s.name.includes(sq.trim()));
 $('#main').innerHTML=`<div class="top"><div><h2>学校データ</h2><p class="lead">校名・公式HP・住所を管理します。住所は、アプリの「地図を見る」ボタンの飛び先になります。</p></div>
 <div class="acts"><button class="btn sbtn" data-a="new">学校を追加</button>${miss.length?`<button class="btn sbtn" data-a="seed">${S.schools.length?`未登録の${miss.length}校を追加登録`:`${miss.length}校を初期登録(最初の1回だけ)`}</button>`:''}</div></div>
 <div class="two"><div><input id="sq" class="field pop" style="box-shadow:var(--pop)" placeholder="学校名で探す" aria-label="学校名で探す" value="${esc(sq)}">

 <div class="col" id="school-list" style="margin-top:12px">${l.map(s=>`<div class="card pop sch ${s.id===selId?'sel':''}" data-pick="${esc(s.id)}"><div class="nm grow">${esc(short(s.name))}</div><span class="tag tag--${kind(s)}">${kLabel[kind(s)]}</span>${s.address?'':'<span class="tag tag--no">住所なし</span>'}</div>`).join('')||`<p class="empty">${S.schools.length?'見つかりませんでした':'「初期登録」を押すと、schools.js の学校データを登録します。'}</p>`}</div></div>
 <div class="panel pop" id="panel"></div></div>`;
 panel();
 const i=$('#sq');i.oninput=()=>{sq=i.value;const q=sq.trim(),list=$('#school-list');if(!list)return;const filtered=S.schools.filter(s=>s.name.includes(q));list.innerHTML=filtered.map(s=>`<div class="card pop sch ${s.id===selId?'sel':''}" data-pick="${esc(s.id)}"><div class="nm grow">${esc(short(s.name))}</div><span class="tag tag--${kind(s)}">${kLabel[kind(s)]}</span>${s.address?'':'<span class="tag tag--no">住所なし</span>'}</div>`).join('')||`<p class="empty">${S.schools.length?'見つかりませんでした':'「初期登録」を押すと、schools.js の学校データを登録します。'}</p>`}}
function panel(){
 const isNew=selId==='__new',s=S.schools.find(x=>x.id===selId),el=$('#panel');
 if(!s&&!isNew){el.innerHTML='<p class="empty" style="padding:10px 0">左の一覧から学校を選ぶと、ここで編集できます。</p>';return}
 el.innerHTML=`<h3>${isNew?'学校を追加':'学校を編集'}</h3>
 <h3 class="fl">正式名称</h3><input id="pn" class="field" value="${esc(s?.name)}" placeholder="例:静岡市立○○小学校">
 ${isNew?`<h3 class="fl">校種</h3><select id="pt" class="field">${['小学校','中学校','特別支援学校'].map(t=>`<option>${t}</option>`).join('')}</select>`:''}
 <h3 class="fl">公式HP</h3><input id="pw" class="field" type="url" placeholder="https://" value="${esc(s?.website)}">
 <h3 class="fl">住所(地図ボタンの飛び先になります)</h3><input id="pa" class="field" placeholder="例:静岡市葵区○○町1-2-3" value="${esc(s?.address)}">
 <h3 class="fl">公式下校ルールPDF</h3><p class="bd">題名・年度・改訂日は自由に変更できます。PDFは複数ページのまま登録されます。</p>
 <div class="col" style="margin-top:8px">${(s?.officialPdfs||[]).map(d=>`<div class="card" style="display:block;padding:12px">
  <input class="field" data-pdf-title="${esc(d.id)}" value="${esc(d.title)}" aria-label="PDF題名">
  <div class="row" style="margin-top:8px"><input class="field" style="flex:1;min-width:100px" data-pdf-year="${esc(d.id)}" value="${esc(d.year||'')}" placeholder="年度（例：令和8年度）"><input class="field" style="flex:1;min-width:120px" data-pdf-date="${esc(d.id)}" type="date" value="${esc(d.revisionDate||'')}"></div>
  <div class="row" style="margin-top:8px"><label class="btn sbtn">PDFを差し替え<input type="file" accept="application/pdf,.pdf" hidden data-pdf-replace="${esc(d.id)}"></label><button class="btn sbtn" data-a="pdf-save" data-id="${esc(d.id)}">題名等を保存</button><button class="btn btn--danger sbtn" data-a="pdf-del" data-id="${esc(d.id)}">削除</button></div>
 </div>`).join('')||'<p class="empty" style="padding:8px">公式PDFはまだ登録されていません。</p>'}</div>
 <div class="card" style="display:block;padding:12px;margin-top:12px"><h3 class="fl" style="margin-top:0">新しいPDFを追加</h3>
 <input id="pdf-title-new" class="field" placeholder="題名（自由に設定）">
 <div class="row" style="margin-top:8px"><input id="pdf-year-new" class="field" style="flex:1;min-width:100px" placeholder="年度（例：令和8年度）"><input id="pdf-date-new" class="field" style="flex:1;min-width:120px" type="date" aria-label="改訂日"></div>
 <input id="pdf-file-new" type="file" accept="application/pdf,.pdf" class="field" style="margin-top:8px">
 <button class="btn btn--primary sbtn" style="margin-top:8px;width:100%" data-a="pdf-add">PDFを登録</button></div>
 <div class="row" style="margin-top:18px"><button class="btn sbtn" data-a="maptest">地図で確認</button><button class="btn btn--primary sbtn" data-a="save">保存する</button></div>
 ${isNew?'':'<button class="btn btn--danger sbtn" style="margin-top:18px" data-a="delschool">この学校を削除</button>'}`}
async function schoolAct(a,id){
 if(a==='new'){selId='__new';return schools(true)}
 if(a==='maptest'){const q=$('#pa').value.trim()||$('#pn').value.trim();if(q)open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank','noopener');return}
 if(a==='save'){const name=$('#pn').value.trim(),website=$('#pw').value.trim(),address=$('#pa').value.trim();if(!name){toast('正式名称を入力してください');return}
  if(selId==='__new'){const type=$('#pt').value,id=`${type}-x${Date.now().toString(36)}`;await F.setDoc(F.doc(db,'schools',id),{name,type,website,address,pointCount:0});selId=id}
  else await F.updateDoc(F.doc(db,'schools',selId),{name,website,address});
  toast('保存しました');return schools()}
 if(a==='pdf-add'){
  const title=$('#pdf-title-new').value.trim(),year=$('#pdf-year-new').value.trim(),revisionDate=$('#pdf-date-new').value,file=$('#pdf-file-new').files?.[0];
  if(!title){toast('PDFの題名を入力してください');return}
  if(!file){toast('PDFファイルを選択してください');return}
  const btn=app.querySelector('[data-a="pdf-add"]');btn.disabled=true;btn.textContent='アップロード中…';
  try{const url=await uploadPdf(file),id=F.doc(F.collection(db,'schools',selId,'_ids')).id;
   const docs=[...(S.schools.find(x=>x.id===selId)?.officialPdfs||[]),{id,title,year,revisionDate,url,updatedAt:new Date().toISOString()}];
   await F.updateDoc(F.doc(db,'schools',selId),{officialPdfs:docs});await loadSchools();toast('公式PDFを登録しました');return schools(true)
  }finally{if(btn.isConnected){btn.disabled=false;btn.textContent='PDFを登録'}}
 }
 if(a==='pdf-save'){
  const s=S.schools.find(x=>x.id===selId),docs=[...(s.officialPdfs||[])];
  const d=docs.find(x=>x.id===id);if(!d)return;
  d.title=$('[data-pdf-title="'+id+'"]').value.trim();d.year=$('[data-pdf-year="'+id+'"]').value.trim();d.revisionDate=$('[data-pdf-date="'+id+'"]').value;
  if(!d.title){toast('題名を入力してください');return}
  await F.updateDoc(F.doc(db,'schools',selId),{officialPdfs:docs});await loadSchools();toast('PDF情報を保存しました');return schools(true)
 }
 if(a==='pdf-del'){
  const s=S.schools.find(x=>x.id===selId);if(!confirm('このPDFの登録情報を削除しますか？\\n（Cloudinary上のファイル自体は残ります）'))return;
  await F.updateDoc(F.doc(db,'schools',selId),{officialPdfs:(s.officialPdfs||[]).filter(d=>d.id!==id)});await loadSchools();toast('PDFを一覧から削除しました');return schools(true)
 }
 if(a==='delschool'){const s=S.schools.find(x=>x.id===selId);if(!confirm(`${s.name} を削除しますか?\n(登録済みの送迎ポイントは画面に出なくなります)`))return;
  await F.deleteDoc(F.doc(db,'schools',selId));selId=null;toast('削除しました');return schools()}
 if(a==='seed'){const have=new Set(S.schools.map(x=>x.id)),miss=(window.SCHOOLS||[]).filter(x=>!have.has(x.id));
  if(!confirm(`${miss.length}校を登録します。よろしいですか?`))return;
  for(let i=0;i<miss.length;i+=400){const b=F.writeBatch(db);miss.slice(i,i+400).forEach(x=>b.set(F.doc(db,'schools',x.id),{name:x.name,type:x.type,website:x.website||'',address:'',pointCount:0}));await b.commit()}
  toast(`${miss.length}校を登録しました`);return schools()}}

app.addEventListener('change',async e=>{
 const input=e.target.closest('[data-pdf-replace]');if(!input||!input.files?.[0])return;
 const id=input.dataset.pdfReplace,file=input.files[0],s=S.schools.find(x=>x.id===selId);input.value='';
 if(!s)return;
 try{toast('PDFをアップロード中…');const url=await uploadPdf(file),docs=(s.officialPdfs||[]).map(d=>d.id===id?{...d,url,updatedAt:new Date().toISOString()}:d);
  await F.updateDoc(F.doc(db,'schools',selId),{officialPdfs:docs});await loadSchools();toast('PDFを差し替えました');await schools(true)
 }catch(er){toast('差し替えできませんでした: '+errMsg(er))}
});
/* ===== お知らせ ===== */
async function notices(){
 S.notices=(await F.getDocs(F.query(F.collection(db,'notices'),F.orderBy('createdAt','desc')))).docs.map(d=>({id:d.id,...d.data()}));
 $('#main').innerHTML=`<h2>お知らせ</h2><p class="lead">投稿すると、アプリの「お知らせ」タブに表示されます。</p>
 <div class="card pop" style="display:block;margin-top:18px;padding:18px"><h3 class="fl" style="margin-top:0">タイトル</h3><input id="nt" class="field" placeholder="例:冬休み中の送迎について"><h3 class="fl">本文(任意)</h3><textarea id="nb" class="field" style="height:96px;resize:none"></textarea><button class="btn btn--dark" style="width:100%;margin-top:14px" data-a="npost">投稿する</button></div>
 <div class="col">${S.notices.map(n=>`<div class="card pop"><div class="grow"><div class="nm">${esc(n.title)}</div>${n.body?`<div class="bd" style="white-space:pre-wrap">${esc(n.body)}</div>`:''}<div class="bd">${dt(n.createdAt)}</div></div><button class="btn btn--danger sbtn" data-a="ndel" data-id="${n.id}">削除</button></div>`).join('')||'<p class="empty">お知らせはまだありません。</p>'}</div>`}
async function noticeAct(a,id){
 if(a==='ndel'){if(!confirm('このお知らせを削除しますか?'))return;await F.deleteDoc(F.doc(db,'notices',id));toast('削除しました');return show()}
 const title=$('#nt').value.trim();if(!title){toast('タイトルを入力してください');return}
 await F.addDoc(F.collection(db,'notices'),{title,body:$('#nb').value.trim(),createdAt:F.serverTimestamp(),uid:U.uid});toast('投稿しました');show()}

/* ===== クリック処理 ===== */
app.addEventListener('click',async e=>{
 const rq=e.target.closest('[data-req]');if(rq){await requestAct(rq.dataset.req,rq.dataset.id,rq);return}
 const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;return show()}
 const pk=e.target.closest('[data-pick]');if(pk){selId=pk.dataset.pick;app.querySelectorAll('.sch').forEach(c=>c.classList.toggle('sel',c===pk));return panel()}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 try{
  if(['approve','reject','stop','admin','member','del'].includes(a))await userAct(a,b.dataset.id,b);
  else if(['new','maptest','save','delschool','seed','pdf-add','pdf-save','pdf-del'].includes(a))await schoolAct(a,b.dataset.id);
  else await noticeAct(a,b.dataset.id);
 }catch(er){toast(errMsg(er))}});
</script>
<script src="schools.js"></script>
