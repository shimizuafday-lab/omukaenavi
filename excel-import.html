<!doctype html>
<html lang="ja" data-theme="mint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Excel初回取り込み | お迎えルールナビ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
body{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:24px;margin:0}.lead{font-size:14px;line-height:1.8;margin:8px 0 18px}
.panel{padding:18px;margin-top:14px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat>div{padding:12px;border:2px solid var(--ink);border-radius:16px;background:var(--surface);text-align:center}.stat b{display:block;font-size:25px}
#log{white-space:pre-wrap;line-height:1.7;font-size:13px;max-height:300px;overflow:auto;margin-top:14px}
button{width:100%;min-height:54px;margin-top:16px;font-size:16px}.warn{background:var(--sun);padding:12px;border:2px solid var(--ink);border-radius:14px;font-size:13px;line-height:1.7;margin-top:14px}
</style>
</head>
<body>
<header><div class="sm">お迎えルールナビ / 管理者用</div><h1>Excelデータ 初回取り込み</h1><p class="lead">学校別Excelから統合した送迎ルールと参考画像を、既存の学校データへ追加します。既存の送迎ポイント・校門写真・見取図・お気に入り・事業所設定は上書きしません。</p></header>
<div id="app"><div class="card pop panel">ログイン状態を確認しています…</div></div>
<script src="schools.js"></script>
<script type="module">
import {auth,db,A,F,esc,toast,watchSession,uploadImage} from './core.js';
const $=s=>document.querySelector(s),app=$('#app');
let currentUser=null,profile=null,data=null,busy=false;
const logLines=[];
function log(s){logLines.push(s);const el=$('#log');if(el){el.textContent=logLines.join('\n');el.scrollTop=el.scrollHeight}}
function gate(title,body){app.innerHTML=`<div class="card pop panel"><h2>${title}</h2><p class="lead">${body}</p><a class="btn btn--primary" href="index.html">アプリへ戻る</a></div>`}
async function loadData(){const r=await fetch('./excel-rules.json',{cache:'no-store'});if(!r.ok)throw new Error('excel-rules.jsonを読み込めません');data=await r.json();}
async function ensureMasterSchools(){
 const master=window.SCHOOLS||[],docs=(await F.getDocs(F.collection(db,'schools'))).docs;
 const existing=new Map(docs.map(d=>[d.id,d])),batch=F.writeBatch(db);let created=0,addresses=0;
 for(const m of master){
  if(!m?.id)continue;
  const d=existing.get(m.id);
  if(!d){batch.set(F.doc(db,'schools',m.id),{name:m.name,type:m.type,website:m.website||'',address:m.address||'',pointCount:0});created++;}
  else if(!String(d.data().address||'').trim()&&String(m.address||'').trim()){
   batch.update(F.doc(db,'schools',m.id),{address:m.address});addresses++;
  }
 }
 if(created||addresses){await batch.commit();log(`学校マスター確認: 新規 ${created}校 / 空欄住所の補完 ${addresses}校（既存の他項目は保持）`);}
 else log('学校マスター確認: 登録済み。追加・住所補完はありません。');
}
function render(){
 const n=data.schools.length,images=data.schools.reduce((a,s)=>a+s.images.length,0),entries=data.schools.reduce((a,s)=>a+s.sourceEntryCount,0);
 app.innerHTML=`<div class="card pop panel"><div class="stat"><div><b>${n}</b>対象校</div><div><b>${entries}</b>元の事業所記載</div><div><b>${images}</b>参考画像</div></div>
 <div class="warn">取り込みは管理者アカウントでのみ実行できます。既存のポイントは削除・上書きせず、Excel由来のポイントを追加します。同じ学校への再取り込みは学校ごとの取込済み印で防止します。</div>
 <p class="lead">学校ごとに「駐車・進入ルール」「引き渡し方法」「その他・注意事項」を各1件にまとめて登録します。参考画像は下から11枚まとめて選択するとCloudinaryへアップロードします。矛盾が残る記載には「要確認」を付けます。</p>
 <label class="btn" style="display:block;text-align:center;margin-top:14px">参考画像11枚を選択<input id="imageFiles" type="file" accept="image/*" multiple hidden></label><p id="imageStatus" class="lead">画像は未選択です。ルールだけ先に取り込むこともできます。</p>
 <button id="run" class="btn btn--primary">初回取り込みを開始</button><div id="log">準備完了。実行ボタンを押すと開始します。</div></div>`;
 $('#run').onclick=runImport;
 $('#imageFiles').onchange=()=>{const files=Array.from($('#imageFiles').files||[]),selected=new Set(files.map(f=>f.name)),expected=data.schools.flatMap(s=>s.images.map(im=>im.file.split('/').pop())),matched=expected.filter(n=>selected.has(n)).length;$('#imageStatus').textContent=files.length?`${files.length}枚を選択中（必要な画像との一致 ${matched}/${expected.length}枚）`:'画像は未選択です。ルールだけ先に取り込むこともできます。';};
}
async function runImport(){
 if(busy)return;busy=true;const btn=$('#run');btn.disabled=true;btn.textContent='取り込み中…';logLines.length=0;
 let imported=0,skipped=0,missing=0,pointsAdded=0,imagesAdded=0,failed=0,partial=0;
 const selectedFiles=new Map(Array.from($('#imageFiles')?.files||[]).map(f=>[f.name,f]));
 try{await ensureMasterSchools();}catch(e){log(`学校マスターの準備に失敗: ${e.message||e}`);btn.textContent='取り込み中断';busy=false;return;}
 for(let i=0;i<data.schools.length;i++){
  const s=data.schools[i];
  try{
   const schoolRef=F.doc(db,'schools',s.id),schoolSnap=await F.getDoc(schoolRef);
   if(!schoolSnap.exists()){missing++;log(`未登録のためスキップ: ${s.name}`);continue;}
   const current=schoolSnap.data();
   if(Number(current.excelImportVersion||0)>=1){skipped++;log(`取込済み: ${s.name}`);continue;}
   const oldImages=Array.isArray(current.referenceImages)?current.referenceImages:[];
   const uploads=[];let imageErrors=0;
   for(const im of s.images){
    if(oldImages.some(x=>x.sourceFile===im.file))continue;
    try{
     const fileName=im.file.split('/').pop(),file=selectedFiles.get(fileName);
     if(!file)throw new Error(`画像「${fileName}」が選択されていません`);
     const url=await uploadImage(file,{raw:true});
     uploads.push({url,label:im.label||'学校の参考画像',source:'Excel',sourceFile:im.file});
     log(`画像アップロード完了: ${s.name} (${uploads.length}/${s.images.length})`);
    }catch(imageError){imageErrors++;log(`画像アップロード未完了: ${s.name} — ${imageError.message||imageError}`);}
   }
   const definitions=[
    ['parking','駐車場','駐車・進入ルール'],
    ['handoff','乗降場所','引き渡し方法'],
    ['other','注意点','その他・注意事項']
   ];
   const batch=F.writeBatch(db);let addedHere=0;const now=Date.now();
   for(const [key,cat,title] of definitions){
    let body=(s[key]||[]).join('\n\n');
    if(key==='other'&&s.review?.length)body+='\n\n【要確認】\n'+s.review.join('\n');
    if(!body.trim())continue;
    const pid='excel-v1-'+key,pointRef=F.doc(db,'schools',s.id,'points',pid),pointSnap=await F.getDoc(pointRef);
    if(pointSnap.exists())continue;
    batch.set(pointRef,{cat,title,body,img:'',uid:currentUser.uid,userName:'Excel一括取り込み',order:now+addedHere,createdAt:F.serverTimestamp(),source:'excel-import',importVersion:1});
    addedHere++;
   }
   const mergedImages=[...oldImages,...uploads];
   const allImagesPresent=s.images.every(im=>mergedImages.some(x=>x.sourceFile===im.file));
   const patch={excelImportVersion:allImagesPresent?1:0,excelImportedAt:F.serverTimestamp(),pointCount:(Number(current.pointCount)||0)+addedHere};
   if(uploads.length)patch.referenceImages=mergedImages;
   batch.update(schoolRef,patch);
   await batch.commit();
   imported++;pointsAdded+=addedHere;imagesAdded+=uploads.length;
   if(imageErrors||!allImagesPresent){partial++;log(`ルール登録完了（画像未完了）: ${s.name}（ポイント ${addedHere}件 / 新規画像 ${uploads.length}枚）`);}
   else log(`登録完了: ${s.name}（ポイント ${addedHere}件 / 新規画像 ${uploads.length}枚）`);
  }catch(e){failed++;log(`エラー: ${s.name} — ${e.message||e}`);}
 }
 log('');log(`ルール登録: ${imported}校 / ポイント ${pointsAdded}件 / 新規画像 ${imagesAdded}枚`);log(`スキップ: 取込済み ${skipped}校 / 学校未登録 ${missing}校 / エラー ${failed}校 / 画像未完了 ${partial}校`);
 btn.textContent='取り込み処理終了';busy=false;
}
watchSession(async(u,p)=>{
 currentUser=u;profile=p;
 if(!u){gate('ログインしてください','先にアプリで管理者アカウントへログインしてから、このページを開いてください。');return;}
 if(!p||p.status!=='active'||p.role!=='admin'){gate('管理者のみ利用できます','この取り込みページは承認済みの管理者だけが実行できます。');return;}
 try{await loadData();render();}catch(e){gate('データを読み込めません',esc(e.message||e));}
});
</script>
</body></html>
